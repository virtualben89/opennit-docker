# Baut das OpenNIT-Image, sobald der Update-Server (Kanal "stable") eine neue Versionsnummer
# ausliefert (Datei VERSION im Paket), und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/<owner>/opennit). Zwischenstände ohne neue Versionsnummer werden nicht gebaut.
#
# Sicherheits-Neubau: Montags scannt der Lauf zusätzlich das veröffentlichte Image mit Trivy.
# Gibt es für HIGH/CRITICAL-Lücken inzwischen Paket-Updates, wird dieselbe Version mit
# aktuellem Basis-Image und aktuellen Debian-Paketen neu gebaut (ohne neues Release).
#
# Tags: <version> (1.2.2), <major.minor> (1.2), <major> (1), latest, sha-<7 Zeichen>
#       Vorabversionen (1.3.0-rc.1) erhalten nur <version> und sha-…
# Bei neuer Versionsnummer zusätzlich ein GitHub-Release mit dem Changelog-Abschnitt.
name: OpenNIT-Image bauen

on:
  # Täglich 6:00 Uhr deutscher Zeit. GitHub rechnet in UTC: 4:00 UTC = 6:00 Sommerzeit,
  # 5:00 UTC = 6:00 Winterzeit. Der jeweils unpassende Lauf beendet sich sofort.
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Auch ohne neue Versionsnummer neu bauen"
        type: boolean
        default: false
      security_check:
        description: "Sicherheitsscan des veröffentlichten Images ausführen (sonst nur montags)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - php.ini
      - vhost.conf
      - .github/workflows/build.yml

permissions:
  contents: write    # upstream.json committen, Releases anlegen
  packages: write    # Image nach ghcr.io pushen

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  UPDATE_BASE: https://update.loheide.cloud/opennit
  USER_AGENT: OpenNIT-Docker-Build
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upstream-Stand prüfen
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          SECURITY_CHECK: ${{ inputs.security_check }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            # Sommerzeit (+0200) -> Lauf um 4:00 UTC, Winterzeit (+0100) -> Lauf um 5:00 UTC
            case "$(TZ=Europe/Berlin date +%z)" in
              +0200) expected="0 4 * * *" ;;
              *)     expected="0 5 * * *" ;;
            esac
            if [ "$SCHEDULE" != "$expected" ]; then
              echo "fetch=false" >> "$GITHUB_OUTPUT"
              echo "Zeitplan '$SCHEDULE' entspricht heute nicht 6:00 Uhr deutscher Zeit – übersprungen." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          remote=$(curl -fsSL -A "$USER_AGENT" "$UPDATE_BASE/version" | jq -r '.sha // empty')
          [[ "$remote" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Ungültige Antwort vom Update-Server: '$remote'"; exit 1; }
          known=$(jq -r '.sha // empty' upstream.json 2>/dev/null || true)
          # Unveränderter Commit -> sicher keine neue Version, Paket gar nicht erst laden.
          # (/version meldet als "version" nur "Unreleased"; die echte Nummer steht im Paket.)
          fetch=false
          if [ "$remote" != "$known" ] || [ "$EVENT" = push ] || [ "$FORCE" = true ]; then fetch=true; fi
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"
          echo "Upstream: $remote | zuletzt gebaut: ${known:-–} | Paket prüfen: $fetch" | tee -a "$GITHUB_STEP_SUMMARY"

          # Wöchentlicher Sicherheitsscan: montags (deutsche Zeit) oder manuell angefordert
          weekly=false
          if { [ "$EVENT" = schedule ] && [ "$(TZ=Europe/Berlin date +%u)" = 1 ]; } || [ "$SECURITY_CHECK" = true ]; then
            weekly=true
          fi
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "Sicherheitsscan: $weekly" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sicherheitsscan des veröffentlichten Images
        id: sec
        if: steps.check.outputs.weekly == 'true'
        run: |
          set -euo pipefail
          version=$(jq -r '.version // empty' upstream.json 2>/dev/null || true)
          [ -n "$version" ] || { echo "Noch kein gebautes Image vermerkt – Scan übersprungen."; exit 0; }
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opennit:$version"
          mkdir -p /tmp/trivy
          # Nur Lücken, für die es bereits ein Paket-Update gibt – nur die behebt ein Neubau.
          docker run --rm -v /tmp/trivy:/out "$TRIVY_IMAGE" image -q --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --format json -o /out/published.json "$img"
          count=$(jq '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' /tmp/trivy/published.json)
          rebuild=false; [ "$count" -gt 0 ] && rebuild=true
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          {
            echo "### Sicherheitsscan \`$img\`"
            echo "Behebbare HIGH/CRITICAL-Lücken: **$count** → Neubau: **$rebuild**"
            if [ "$count" -gt 0 ]; then
              echo; echo "| Schwere | CVE | Paket | Version |"; echo "|---|---|---|---|"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) → \(.FixedVersion) |"' \
                /tmp/trivy/published.json | sort -u
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Paket laden und auswerten
        id: pkg
        if: steps.check.outputs.fetch == 'true' || steps.sec.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          SECURITY: ${{ steps.sec.outputs.rebuild }}
        run: |
          set -euo pipefail
          curl -fsSL -A "$USER_AGENT" "$UPDATE_BASE/zip" -o src/opennit.zip
          top=$(unzip -Z1 src/opennit.zip | awk -F/ 'NR==1{print $1}')
          sha=$(grep -oE '[0-9a-f]{40}$' <<<"$top" || true)
          [ -n "$sha" ] || { echo "::error::Commit-SHA nicht im ZIP-Verzeichnisnamen '$top' gefunden"; exit 1; }

          mkdir -p /tmp/pkg
          unzip -q -o src/opennit.zip "$top/VERSION" "$top/CHANGELOG.md" -d /tmp/pkg
          version=$(tr -d '[:space:]' < "/tmp/pkg/$top/VERSION")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Unerwartete VERSION '$version'"; exit 1; }

          # Bauen bei neuer Versionsnummer, Änderungen am Image, manuell erzwungen oder
          # wenn der Sicherheitsscan behebbare Lücken gefunden hat. Der Grund landet als Label im Image.
          known_version=$(jq -r '.version // empty' upstream.json 2>/dev/null || true)
          reason=""
          if   [ "$version" != "$known_version" ]; then reason=release
          elif [ "$SECURITY" = true ];             then reason=security
          elif [ "$EVENT" = push ];                then reason=image
          elif [ "$FORCE" = true ];                then reason=manual
          fi
          build=false; [ -n "$reason" ] && build=true
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "Version $version ist bereits gebaut (neuer Zwischenstand ${sha:0:7} ohne neue Versionsnummer) – kein Build." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Changelog-Abschnitt dieser Version: von "## [x.y.z]" bis zur nächsten "## ["-Überschrift
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' \
            "/tmp/pkg/$top/CHANGELOG.md" > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "_Kein Changelog-Eintrag für $version gefunden._" > /tmp/notes.md
          manual=false
          grep -qE '^### .*(Wichtig für dieses Update|Vor dem Einspielen)' /tmp/notes.md && manual=true

          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opennit"
          tags="$img:$version,$img:sha-${sha:0:7}"
          if [[ "$version" != *-* ]]; then
            IFS=. read -r major minor _ <<<"$version"
            tags="$tags,$img:$major.$minor,$img:$major,$img:latest"
          fi

          release=false
          gh release view "v$version" >/dev/null 2>&1 || release=true

          {
            echo "sha=$sha"; echo "version=$version"; echo "image=$img"
            echo "tags=$tags"; echo "manual=$manual"; echo "release=$release"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### OpenNIT $version (\`${sha:0:7}\`) – Anlass: $reason"
            echo "Tags: \`${tags//,/\`, \`}\`"
            echo "Manuelle Schritte im Changelog: $manual | neues Release: $release"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4
        if: steps.pkg.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.pkg.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.pkg.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        if: steps.pkg.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pkg.outputs.tags }}
          pull: true      # immer das aktuelle Basis-Image (php:8.4-apache) verwenden
          build-args: |
            REFRESH=${{ github.run_id }}
          labels: |
            org.opencontainers.image.title=OpenNIT
            org.opencontainers.image.version=${{ steps.pkg.outputs.version }}
            org.opencontainers.image.revision=${{ steps.pkg.outputs.sha }}
            org.opencontainers.image.created=${{ steps.pkg.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            de.opennit.manual-steps=${{ steps.pkg.outputs.manual }}
            de.opennit.build-reason=${{ steps.pkg.outputs.reason }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Neues Image prüfen
        if: steps.pkg.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.pkg.outputs.image }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy
          docker run --rm -v /tmp/trivy:/out "$TRIVY_IMAGE" image -q --scanners vuln \
            --severity HIGH,CRITICAL --format json -o /out/new.json "$IMAGE:$VERSION"
          jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID) as $v
            | "### Prüfscan des neuen Images\n"
            + "HIGH/CRITICAL gesamt: **\($v | length)**, davon mit verfügbarem Fix: **\([$v[] | select(.FixedVersion != null and .FixedVersion != "")] | length)**"' \
            /tmp/trivy/new.json >> "$GITHUB_STEP_SUMMARY"

      - name: Gebauten Stand im Repo vermerken
        if: steps.pkg.outputs.build == 'true'
        env:
          SHA: ${{ steps.pkg.outputs.sha }}
          VERSION: ${{ steps.pkg.outputs.version }}
          CREATED: ${{ steps.pkg.outputs.created }}
          REASON: ${{ steps.pkg.outputs.reason }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg sha "$SHA" --arg built_at "$CREATED" --arg reason "$REASON" \
            '{version: $version, sha: $sha, built_at: $built_at, reason: $reason}' > upstream.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.json
          if ! git diff --cached --quiet; then
            case "$REASON" in
              security) note=" – Sicherheits-Neubau" ;;
              image)    note=" – Image-Änderung" ;;
              manual)   note=" – manueller Neubau" ;;
              *)        note="" ;;
            esac
            git commit -m "OpenNIT $VERSION (${SHA:0:7})$note"
            git push
          fi

      - name: GitHub-Release anlegen
        if: steps.pkg.outputs.build == 'true' && steps.pkg.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pkg.outputs.sha }}
          VERSION: ${{ steps.pkg.outputs.version }}
          IMAGE: ${{ steps.pkg.outputs.image }}
          MANUAL: ${{ steps.pkg.outputs.manual }}
        run: |
          set -euo pipefail
          {
            if [ "$MANUAL" = true ]; then
              echo '> [!WARNING]'
              echo '> **Dieses Update enthält manuelle Schritte.** Vor dem Einspielen den Abschnitt'
              echo '> „Wichtig für dieses Update“ bzw. „Vor dem Einspielen lesen“ unten lesen.'
              echo '>'
              echo '> **This update requires manual steps.** Read the section “Wichtig für dieses'
              echo '> Update” (important for this update) or “Vor dem Einspielen lesen” (read before'
              echo '> applying) below before updating.'
              echo
            fi
            echo "**Image:** \`$IMAGE:$VERSION\` · **Upstream:** \`$SHA\`"
            echo
            echo '```bash'
            echo './update.sh'
            echo '```'
            echo
            echo '---'
            echo
            echo '_Changelog des OpenNIT-Projekts (nur auf Deutsch) · Changelog of the OpenNIT project (German only)_'
            echo
            cat /tmp/notes.md
          } > /tmp/body.md
          args=(--title "OpenNIT $VERSION" --notes-file /tmp/body.md --target "$(git rev-parse HEAD)")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh release create "v$VERSION" "${args[@]}"
